version: '3.8'
services:
  # Entitas 1: Database
  db:
    image: postgres:15-alpine
    container_name: pmi_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Entitas 2: Backend NestJS
  api:
    build: . # Docker akan mencari file 'Dockerfile' di folder ini untuk membangun backend
    container_name: pmi_nestjs_api
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public"
    depends_on:
      - db # Memastikan database jalan duluan sebelum backend